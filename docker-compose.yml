version: "3.9"

services:
  myapp:
    image: ${DOCKERHUB_USERNAME}/myapp:latest
    container_name: myapp
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3